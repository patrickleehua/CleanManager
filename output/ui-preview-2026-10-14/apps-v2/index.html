<script>
const apps=[

{id:'docker',name:'Docker Desktop',version:'4.34',source:'安装记录',path:'C:/Program Files/Docker',icon:'D',color:'#427d9a',base:980,user:7622,total:8602,shared:true,unknown:false,cache:[],keep:'容器、镜像与卷数据',tab:'user'},

const byId=id=>apps.find(a=>a.id===id),$=id=>document.getElementById(id),selected=new Set();let expanded='code',filter='all',timer,mode='同卷隔离';const fmt=n=>n>=1024?(n/1024).toFixed(1)+' GiB':n+' MiB';const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function icon(a,large=false){return '<span class="icon '+(large?'large':'')+'" style="background:'+a.color+'">'+a.icon+'</span>'}
function visibleApps(){const q=$('search').value.trim().toLowerCase();let v=apps.filter(a=>(a.name+' '+a.source+' '+a.path).toLowerCase().includes(q)&&(filter==='all'||filter==='cache'&&a.cache.length||filter==='shared'&&a.shared||filter==='unknown'&&a.unknown));return $('sort').value==='default'?v:v.sort($('sort').value==='name'?(a,b)=>a.name.localeCompare(b.name,'zh-CN'):(a,b)=>b.total-a.total)}
function render(){const v=visibleApps();$('listCount').textContent=v.length+' 个实例';$('apps').innerHTML=v.length?v.map(a=>'<article class="app '+(expanded===a.id?'expanded':'')+'"><button class="app-main" onclick="expandApp(\''+a.id+'\')" aria-expanded="'+(expanded===a.id)+'" aria-controls="panel-'+a.id+'">'+icon(a)+'<div><div class="app-name">'+a.name+'</div><div class="app-meta">'+a.version+' · '+a.source+' · '+(a.id==='portable'?'D:/Apps/ChromePortable':a.id==='code'?'当前用户':'系统安装')+'</div></div><div class="app-space"><strong>'+fmt(a.total)+'</strong><small>'+(a.shared?'共享空间另列':a.unknown?'部分覆盖 · 待判断':'已识别关联内容')+'</small></div><span class="chevron">›</span></button>'+(expanded===a.id?'<div class="expansion" id="panel-'+a.id+'">'+expandedContent(a)+'</div>':'')+'</article>').join(''):'<div class="empty">没有匹配的应用<br><br><button onclick="resetFilters()">清除筛选</button></div>';renderDetail();updateSummary()}
function expandedContent(a){const tabs=[['cache','缓存候选'],['user','用户数据'],['shared','共享与待判断']];let body=a.tab==='cache'?a.cache.length?a.cache.map(c=>'<label class="item"><input type="checkbox" data-item="'+c.id+'" '+(selected.has(c.id)?'checked':'')+' onchange="toggleItem(\''+c.id+'\',this.checked)"><span class="item-name">'+c.name+'<small>'+c.path+'</small></span><span class="pill">演示规则</span><span class="item-size">'+fmt(c.size)+'</span></label>').join(''):'<div class="inline-note">暂无满足演示规则的缓存候选</div>':a.tab==='user'?'<div class="item"><input type="checkbox" disabled><span class="item-name">'+a.keep+'<small>个人数据与配置默认保留</small></span><span class="pill keep">保留</span><span class="item-size">'+fmt(a.user)+'</span></div>':'<div class="item"><input type="checkbox" disabled><span class="item-name">'+(a.shared?'共享关联目录':'关联不明目录')+'<small>'+(a.shared?'可能由其他安装实例使用，不计入独占':'未发现安装记录不等于可删除残留')+'</small></span><span class="pill keep">保留</span><span class="item-size">未知</span></div>';return '<div class="tabs" role="group" aria-label="关联内容分类">'+tabs.map(([key,label])=>'<button class="'+(a.tab===key?'active':'')+'" onclick="setTab(\''+a.id+'\',\''+key+'\')">'+label+(key==='cache'?' · '+a.cache.length:'')+'</button>').join('')+'</div>'+body+'<div class="inline-note"><span>'+(a.tab==='cache'?'缓存可重新生成 · 首次启动可能变慢':'归属证据与保护规则优先')+'</span><button onclick="evidence(\''+a.id+'\')">来源证据 ↗</button></div>'}
function expandApp(id){expanded=expanded===id?null:id;render()}function setTab(id,t){byId(id).tab=t;render()}function resetFilters(){$('search').value='';filter='all';document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));render()}
function renderDetail(){let a=byId(expanded)||byId('code');$('detail').innerHTML='<div class="detail-top">'+icon(a,true)+'<div><strong>'+a.name+'</strong><span class="muted">'+a.version+' · '+a.source+'</span></div></div><div class="spacebar"><i style="width:'+(a.base/a.total*100)+'%;background:#95bfa6"></i><i style="width:'+(a.cache.reduce((n,c)=>n+c.size,0)/a.total*100)+'%;background:#c5d4a9"></i><i style="width:'+(a.user/a.total*100)+'%;background:#adb6c5"></i></div><div class="space-row"><span>应用本体</span><b>'+fmt(a.base)+'</b></div><div class="space-row"><span>演示缓存候选</span><b>'+(a.cache.length?fmt(a.cache.reduce((n,c)=>n+c.size,0)):'未识别')+'</b></div><div class="space-row"><span>用户数据 · 保留</span><b>'+fmt(a.user)+'</b></div><div class="space-row"><span>共享 / 未确认</span><b>'+(a.shared?'共享另列':a.unknown?'归属未知':'无已确认共享')+'</b></div><div class="detail-actions"><button onclick="evidence(\''+a.id+'\')">查看来源证据</button><button onclick="locate(\''+a.id+'\')">在磁盘中定位 ↗</button></div>'}
function allItems(){return apps.flatMap(a=>a.cache.map(c=>({...c,app:a.name})))}function chosen(){return allItems().filter(c=>selected.has(c.id))}function toggleItem(id,on){on?selected.add(id):selected.delete(id);updateSummary()}function clearSelection(){selected.clear();render()}function updateSummary(){let c=chosen(),total=c.reduce((n,x)=>n+x.size,0),visible=new Set(visibleApps().flatMap(a=>a.cache.map(c=>c.id))),hidden=c.filter(x=>!visible.has(x.id)).length;$('summary').innerHTML='<span class="dot">●</span>'+(c.length?c.length+' 项缓存 · '+fmt(total)+(hidden?' · '+hidden+' 项在当前筛选外':''):'未选择缓存');$('summaryNote').textContent=c.length?'仅处理固定候选；用户数据与共享目录保留':'选择只生成计划，执行前仍需审阅授权';$('review').disabled=!c.length}
$('search').addEventListener('input',render);$('sort').addEventListener('change',render);document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});
$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'◐ 浅色':'◐ 深色'};function toast(text){$('toast').textContent=text;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3200)}
function closeDialog(){clearInterval(timer);$('dialog').close()}function modal(title,body,actions=''){clearInterval(timer);$('dialogContent').innerHTML='<h2 id="dialogTitle">'+title+'</h2>'+body+'<div class="dialog-actions"><button onclick="closeDialog()">关闭</button>'+actions+'</div>';if(!$('dialog').open)$('dialog').showModal()}
function evidence(id){let a=byId(id);modal(a.name+' · 来源证据','<div class="review-row"><span>安装实例</span><b>'+a.id.toUpperCase()+'-DEMO</b></div><div class="review-row"><span>识别来源</span><b>'+a.source+'</b></div><div class="review-row"><span>位置</span><b style="max-width:75%;overflow-wrap:anywhere">'+a.path+'</b></div><div class="review-row"><span>扫描覆盖</span><b>部分 · 今天 10:24</b></div><div class="review-row"><span>关联规则</span><b>demo.app-cache v1 · 演示规则</b></div><div class="notice">归属证据不等于执行授权；所有候选均为演示数据。</div>','<button class="primary" onclick="closeDialog();locate(\''+id+'\')">查看安装位置</button>')}
function locate(id){let a=byId(id);modal('磁盘定位 · '+a.name,'<div class="review-row"><span>路径</span><b style="max-width:75%;overflow-wrap:anywhere">'+a.path+'</b></div><div class="review-row"><span>本体逻辑大小</span><b>'+fmt(a.base)+'</b></div><div class="notice">演示定位关联对象；完整磁盘旅程可在全部功能预览中查看。</div>','<a href="../index.html" style="align-self:center">打开磁盘预览 ↗</a>')}
function reviewPlan(){const c=chosen();if(!c.length)return;mode='同卷隔离';window.planItems=c.map(x=>({...x}));modal('审阅缓存计划','<span id="planBadge" class="badge">P-APP-DEMO-01 · 演示有效期 15 分钟</span><div class="mode">'+['同卷隔离','回收站','永久删除'].map((m,i)=>'<button class="'+(i===0?'selected':'')+'" onclick="changeMode(this)">'+m+'</button>').join('')+'</div><div id="modeNote" class="notice">可恢复 · 同卷隔离不立即释放空间</div>'+c.map(x=>'<div class="review-row"><div><b>'+x.name+'</b><div class="muted" style="margin-top:5px">'+x.app+'</div></div><b>'+fmt(x.size)+'</b></div>').join('')+'<div class="review-row"><span>用户数据、凭据与共享目录</span><b>保留</b></div><label class="review"><input id="consent" type="checkbox" onchange="document.getElementById(\'execute\').disabled=!this.checked">我已审阅固定对象、模式及恢复限制</label>','<button onclick="closeDialog()">返回修改</button><button id="execute" class="primary" disabled onclick="simulateExecution()">授权并执行 · 演示</button>')}
function changeMode(b){mode=b.textContent;window.planSequence=(window.planSequence||1)+1;$('planBadge').textContent='P-APP-DEMO-'+String(window.planSequence).padStart(2,'0')+' · 新模式需重新审阅';document.querySelectorAll('.mode button').forEach(x=>x.classList.toggle('selected',x===b));$('modeNote').textContent=mode==='同卷隔离'?'可恢复 · 同卷隔离不立即释放空间':mode==='回收站'?'由系统回收站管理恢复 · 不承诺立即释放空间':'不可恢复 · 改变模式生成新的演示计划，需重新审阅';$('consent').checked=false;$('execute').disabled=true}
function simulateExecution(){let n=0,max=window.planItems.length;modal('正在处理 · 演示','<progress id="progress" value="0" max="'+max+'"></progress><div class="review-row"><span id="progressLabel">0 / '+max+'</span><b>'+mode+'</b></div><div class="notice">仅模拟交互，不读取或修改磁盘文件。</div>','<button onclick="stopExecution()">停止后续处理</button>');timer=setInterval(()=>{n++;$('progress').value=n;$('progressLabel').textContent=n+' / '+max;if(n>=max){clearInterval(timer);result(n,false)}},700)}
function stopExecution(){const n=Number($('progress').value);clearInterval(timer);result(n,true)}function result(n,stopped){modal(stopped?'已停止 · 已完成项保留':'处理完成 · 演示','<div class="review-row"><span>已完成 / 未开始</span><b>'+n+' / '+(window.planItems.length-n)+'</b></div><div class="review-row"><span>处理方式</span><b>'+mode+'</b></div><div class="review-row"><span>恢复方式</span><b>'+(mode==='同卷隔离'?'独立恢复计划':mode==='回收站'?'系统回收站':'不可恢复')+'</b></div><div class="notice">'+(mode==='同卷隔离'?'同卷隔离不立即释放空间。':'空间变化需独立观测，不能将处理量当成实际收益。')+'</div>');}
function artwork(dark=false){modal(dark?'深色方案 · 生图模型':'应用 v2 · 生图模型','<img class="model-image" src="'+(dark?'06-applications-dark.png':'05-applications-v2.png')+'" alt="应用页生图模型设计方案">','<button onclick="artwork('+(!dark)+')">切换'+(dark?'浅色':'深色')+'方案</button><a href="'+(dark?'06-applications-dark.png':'05-applications-v2.png')+'" target="_blank" style="align-self:center">打开原图 ↗</a>')}
function benchmark(){modal('Mole 软件页 · 功能对齐','<table class="evidence-table"><tr><td>图标 + 紧凑信息行</td><td>已用于应用浏览</td></tr><tr><td>原位展开关联文件</td><td>已用于缓存、用户数据与共享分组</td></tr><tr><td>底部选择摘要</td><td>已用于固定候选审阅入口</td></tr><tr><td>不明归属默认不选</td><td>保留并显示证据与范围</td></tr><tr><td>更新、卸载、启动项</td><td>后续设计候选，需要独立规划与平台适配</td></tr></table><div class="notice">依据官网公开截图与 REA 官网内容观察。未运行 Mole 桌面程序。</div>','<a href="https://mole.fit/zh/mac-app-uninstaller" target="_blank" style="align-self:center">Mole 官方功能说明 ↗</a><a href="research.json" target="_blank" style="align-self:center">查看证据与设计说明 ↗</a>')}
$('dialog').addEventListener('close',()=>clearInterval(timer));$('statApps').textContent=apps.length;$('statSpace').textContent=fmt(apps.reduce((n,a)=>n+a.total,0));$('statCandidates').textContent=apps.filter(a=>a.cache.length).length;render();
</script></body></html>
