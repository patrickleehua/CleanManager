<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanManager · UI / UX 预览</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#25352e;background:#f6f7f5}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #dbe3dd;background:white;color:#35473d;padding:10px 15px;border-radius:9px}button:hover{background:#edf3ee}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #69ad93;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.45}.primary{background:#287d68;color:white;border-color:#287d68}.primary:hover{background:#216b58}header{display:flex;justify-content:space-between;align-items:center;padding:22px 32px;border-bottom:1px solid #e2e7e2;background:white}header small,.muted{color:#78877d;font-size:13px}.layout{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 87px)}nav{padding:22px 16px;background:#f0f3ef}nav button{display:block;text-align:left;width:100%;margin:3px 0;border:0;background:transparent;font-size:13px}nav button.active{background:white;color:#287d68;box-shadow:0 2px 6px #20352c08}main{padding:26px;min-width:0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}h1{font-size:21px;margin:0 auto 0 0}h2{font-size:18px}.frame{overflow:hidden;aspect-ratio:1.5;background:#fff;border:1px solid #e0e6e0;border-radius:14px;position:relative;box-shadow:0 14px 45px #2841360a}.frame img{position:absolute;width:200%;height:200%;max-width:none;left:0;top:0}.frame.board img{width:100%;height:100%;transform:none!important}.below{display:flex;gap:12px;margin-top:16px;align-items:center;flex-wrap:wrap}.below .muted{margin-right:auto}.tag{background:#e9f1eb;padding:5px 9px;border-radius:6px;font-size:12px}dialog{border:1px solid #dce6df;border-radius:18px;max-width:700px;width:calc(100% - 30px);padding:26px;color:#25352e;box-shadow:0 30px 100px #162e3333}dialog::backdrop{background:#172c2650;backdrop-filter:blur(4px)}.row{display:flex;justify-content:space-between;gap:18px;padding:15px 0;border-bottom:1px solid #edf0eb}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.notice{padding:13px;background:#f1f5ef;border-radius:9px;margin:15px 0;font-size:14px}.amber{background:#faf1df}label{display:flex;gap:10px;align-items:center;margin:12px 0}.mode{display:flex;gap:6px;margin:16px 0}.mode button.selected{color:#287d68;border-color:#287d68;background:#eef6f0}progress{width:100%;height:12px;accent-color:#287d68}a{color:#287d68}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:14px 22px;border-radius:12px;background:#253e33;color:white;display:none;z-index:5}.full .frame{position:fixed;inset:20px;aspect-ratio:auto;z-index:4;background:white}.full .frame img{object-fit:fill}.full #expand{position:fixed;right:34px;top:34px;z-index:6}@media(max-width:800px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;padding:8px}nav button{min-width:155px}main{padding:16px}header{padding:18px}.toolbar h1{width:100%}.row{font-size:14px}.full .frame{inset:60px 5px;height:65vw}}
</style>
<header><strong>◈ CleanManager <small>UI / UX Design Preview</small></strong><a href="suite-v3/index.html">全功能 HTML 交互预览 ↗</a><a href="apps-v2/index.html">应用 v2 ↗</a><span class="tag">交互原型 · 演示数据</span></header>
<div class="layout"><nav id="nav" aria-label="功能预览"></nav><main><div class="toolbar"><h1 id="title"></h1><button id="board">整组图</button><button id="expand">放大</button><a id="download" download>下载原图 ↗</a></div><div class="frame" id="frame"><img id="screen" alt=""></div><div class="below"><span id="hint" class="muted"></span><button id="prev">← 上一页</button><button id="next">下一页 →</button><button class="primary" id="demo">体验交互</button></div></main></div>
<dialog id="dialog" aria-labelledby="dialogTitle"><div id="content"></div></dialog><div id="toast" role="status"></div>
<script>
const pages=[
['范围选择','01-scan-space.png',0,'选择范围 → 只读扫描','scan'],
['空间概览','01-scan-space.png',1,'查看已知空间与未读取范围','gaps'],
['磁盘与目录详情','01-scan-space.png',2,'联动图块、目录表与详情抽屉','disk'],
['扫描与停止状态','01-scan-space.png',3,'取消保留已确认结果','scan'],
['清理候选','02-candidates-plans.png',0,'候选默认不勾选','candidates'],
['依据与保护详情','02-candidates-plans.png',1,'查看归属、影响和保留理由','evidence'],
['计划审阅与授权','02-candidates-plans.png',2,'选择模式 → 冻结对象 → 授权','plan'],
['Agent 交接与过期','02-candidates-plans.png',3,'同一计划；过期后重新生成','agent'],
['执行与停止','03-execution-recovery.png',0,'停止后续处理；已完成项保留','execute'],
['结果与空间观测','03-execution-recovery.png',1,'处理量、预计释放和空闲观测分列','report'],
['隔离与恢复冲突','03-execution-recovery.png',2,'恢复冲突默认保留双方','restore'],
['中断核对与清空','03-execution-recovery.png',3,'未知结果先核对；清空独立授权','reconcile'],
['只读应用清单','04-apps-settings.png',0,'同名不同安装实例独立展示','apps'],
['应用关联与证据','04-apps-settings.png',1,'共享空间与未知归属保留','evidence'],
['保护、权限与隐私','04-apps-settings.png',2,'读取权限与产品授权分别呈现','settings'],
['Agent 与有限策略','04-apps-settings.png',3,'预授权默认关闭；精确范围与额度','policy']];
let current=0,isBoard=false,timer=null,mode='同卷隔离';const $=s=>document.getElementById(s);
pages.forEach((p,i)=>{let b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+'  '+p[0];b.onclick=()=>show(i);$('nav').append(b)});
function show(i){current=(i+pages.length)%pages.length;let p=pages[current];$('title').textContent=p[0];$('screen').src=p[1];$('screen').alt=p[0]+' 生图模型设计稿';$('screen').style.transform='translate('+(-(p[2]%2)*50)+'%,'+(-Math.floor(p[2]/2)*50)+'%)';$('hint').textContent=p[3];$('download').href=p[1];[...$('nav').children].forEach((b,j)=>b.classList.toggle('active',current===j))}
$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);$('board').onclick=()=>{isBoard=!isBoard;$('frame').classList.toggle('board',isBoard);$('board').textContent=isBoard?'单页图':'整组图'};$('expand').onclick=()=>{document.body.classList.toggle('full');$('expand').textContent=document.body.classList.contains('full')?'退出放大':'放大'};
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('full');if(!$('dialog').open){if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)}});
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}
function close(){clearInterval(timer);$('dialog').close()}
function modal(title,body,buttons){clearInterval(timer);$('content').innerHTML='<h2 id="dialogTitle">'+title+'</h2>'+body+'<div class="actions"><button onclick="close()">关闭</button>'+buttons+'</div>';if(!$('dialog').open)$('dialog').showModal()}
function plan(){mode='同卷隔离';modal('审阅固定计划','<span class="tag">P-DEMO-042 · 有效期 15 分钟</span><div class="mode">'+['同卷隔离','回收站','永久删除'].map((m,i)=>'<button class="'+(i===0?'selected':'')+'" onclick="setMode(this)">'+m+'</button>').join('')+'</div><div id="modeInfo" class="notice">可恢复 · 同卷移动不立即释放空间</div><div class="row"><span>演示缓存 · 固定对象集合</span><b>240 项 / 1.2 GiB</b></div><div class="row"><span>凭据与源码</span><span>受保护 · 已排除</span></div><label><input id="approve" type="checkbox" onchange="document.getElementById(\'apply\').disabled=!this.checked">我已审阅对象、处理方式和恢复限制</label>','<button id="apply" class="primary" disabled onclick="execute()">授权并执行（演示）</button>')}
function setMode(b){mode=b.textContent;document.querySelectorAll('.mode button').forEach(x=>x.classList.toggle('selected',x===b));$('modeInfo').textContent=mode==='同卷隔离'?'可恢复 · 同卷移动不立即释放空间':mode==='回收站'?'恢复由系统回收站管理 · 不承诺立即释放空间':'不可恢复 · 永久删除需要明确授权';$('approve').checked=false;$('apply').disabled=true}
function execute(){let n=0;modal('执行中 · '+mode,'<progress id="progress" max="240" value="0"></progress><div class="row"><span id="counter">0 / 240</span><span>固定对象集合</span></div><p class="muted">此处仅模拟交互，不读取或处理文件。</p>','<button onclick="stopExecution()">停止后续处理</button>');timer=setInterval(()=>{n=Math.min(240,n+20);$('progress').value=n;$('counter').textContent=n+' / 240';if(n===240){clearInterval(timer);report(false,n)}},220)}
function stopExecution(){let n=$('progress').value;clearInterval(timer);report(true,n)}
function report(stopped=false,n=240){modal(stopped?'已停止 · 已完成项保留':'操作结果 · 演示','<div class="row"><span>成功 / 未开始</span><b>'+n+' / '+(240-n)+'</b></div><div class="row"><span>处理模式</span><b>'+mode+'</b></div><div class="row"><span>卷空闲观测</span><b>'+(mode==='永久删除'?'82.0 → 83.1 GiB':'82.0 → 82.0 GiB')+'</b></div><div class="notice">'+(mode==='同卷隔离'?'同卷隔离不立即释放空间。':mode==='永久删除'?'空闲变化为独立观测，不全部归因于本工具。':'请通过系统回收站恢复。')+'</div>',mode==='同卷隔离'?'<button class="primary" onclick="restore()">查看恢复</button>':'')}
function restore(){modal('原位置已有文件','<div class="notice amber">未覆盖 · 现有文件与隔离文件均保留</div><div class="row"><span>现有 report.cache</span><b>今天 · 8 MiB</b></div><div class="row"><span>隔离 report.cache</span><b>昨天 · 6 MiB</b></div>','<button onclick="close();toast(\'已保留双方，无文件操作\')">保留现状</button><button class="primary" onclick="alternate()">选择其他位置</button>')}
function alternate(){modal('新建独立恢复计划','<label>演示目标<select id="destination"><option>D:/Recovered/report.cache</option><option>C:/Users/Lin/Recovered/report.cache</option></select></label><div class="notice">新位置需重新核验并授权，不沿用隔离授权。</div>','<button class="primary" onclick="close();toast(\'演示恢复计划已生成，等待独立审阅\')">生成恢复计划</button>')}
function candidates(){modal('选择候选','<label><input class="candidate" type="checkbox" onchange="count()">演示缓存 · 800 MiB</label><label><input class="candidate" type="checkbox" onchange="count()">演示临时文件 · 400 MiB</label><label><input disabled type="checkbox">凭据 / 工作树 · 受保护</label><div id="selection" class="notice">0 组已选</div>','<button id="create" class="primary" disabled onclick="plan()">生成计划</button>')}
function count(){let n=document.querySelectorAll('.candidate:checked').length;$('selection').textContent=n+' 组已选';$('create').disabled=!n}
function scan(){modal('选择只读扫描范围','<label>范围<select><option>C:/Users/Lin</option><option>D:/Projects</option></select></label><div class="notice">不跟随链接 · 不下载云占位内容</div>','<button class="primary" onclick="scanning()">开始扫描</button>')}
function scanning(){modal('发现文件中','<div class="row"><span>已确认条目</span><b>18,420 项</b></div><div class="row"><span>已知逻辑大小</span><b>24.6 GiB</b></div><div class="notice">总量未知，展示已知统计。</div>','<button onclick="modal(\'已取消扫描\',\'<div class=notice>已确认结果保留 · 范围未完整扫描</div>\',\'\');show(1)">取消扫描</button><button class="primary" onclick="close();show(1)">查看已有结果</button>')}
function policy(){modal('有限预授权 · 默认关闭','<label><input id="enabled" type="checkbox" onchange="document.getElementById(\'savePolicy\').disabled=!this.checked">启用演示策略</label><div class="row"><span>精确根 / 规则</span><b>D:/Cache/Demo · demo.cache v1</b></div><div class="row"><span>模式</span><b>同卷隔离</b></div><div class="row"><span>单次 / 24 小时</span><b>1 GiB · 1,000 项 / 2 GiB · 2,000 项</b></div><div class="notice">有效 30 天 · 未知或超限转人工审阅</div>','<button id="savePolicy" disabled class="primary" onclick="close();toast(\'策略已保存到当前演示状态\')">保存演示策略</button>')}
$('demo').onclick=()=>{let kind=pages[current][4];if(kind==='scan')scan();else if(kind==='candidates')candidates();else if(kind==='plan')plan();else if(kind==='execute')execute();else if(kind==='restore')restore();else if(kind==='report')report();else if(kind==='policy')policy();else if(kind==='agent')modal('Agent 计划交接','<span class="tag">P-DEMO-042 · 等待人工授权</span><div class="notice">桌面与 CLI 审阅同一对象集合，不重新生成近似计划。</div>','<button class="primary" onclick="plan()">审阅同一计划</button><button onclick="modal(\'计划已过期\',\'<div class=notice>旧计划保留；新计划需重新核验。</div>\',\'<button class=primary onclick=plan()>生成新演示计划</button>\')">体验过期状态</button>');else if(kind==='reconcile')modal('中断后需要核对','<div class="row"><span>已确认成功 / 待核对 / 未开始</span><b>12 / 1 / 27</b></div><div class="notice amber">结果未知的对象不自动重试。</div>','<button class="primary" onclick="modal(\'只读核对完成 · 演示\',\'<div class=notice>已找到演示目标对象。保留核对记录，不重复执行。</div>\',\'\')">只读核对</button>');else if(kind==='gaps')modal('扫描覆盖缺口','<div class="row"><span>受限目录</span><b>权限不足</b></div><div class="row"><span>云占位目录</span><b>避免下载 · 已跳过</b></div><div class="notice">未知空间保持未知，可继续浏览已确认结果。</div>','<button class="primary" onclick="close();show(2)">查看可读结果</button>');else if(kind==='disk')modal('目录详情 · Downloads','<div class="row"><span>逻辑大小</span><b>12.4 GiB</b></div><div class="row"><span>归属</span><b>未知</b></div><div class="notice">大文件浏览提供定位、保护与解释。</div>','<button class="primary" onclick="close();toast(\'已在演示中标记为保护路径\')">添加保护</button>');else if(kind==='apps'||kind==='evidence')modal('归属证据与关联空间','<div class="row"><span>实例</span><b>Demo App · 安装记录</b></div><div class="row"><span>共享容器</span><b>不计入独占容量</b></div><div class="row"><span>未知目录</span><b>仅分析 · 保留</b></div>','<button class="primary" onclick="close();show(2)">在磁盘中查看</button>');else modal('保护与隐私','<label><input type="checkbox" checked disabled>保护工作树、凭据和 AI 会话</label><label><input type="checkbox">演示遥测开关（默认关闭）</label><div class="notice">索引与操作记录仅保留本机。</div>','<button class="primary" onclick="close();toast(\'演示设置已保存\')">保存</button>')};
show(0);
</script></html>
