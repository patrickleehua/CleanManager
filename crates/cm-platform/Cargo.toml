[package]
name = "cm-platform"
description = "CleanManager system access: conditional Windows/macOS backends behind cm-core traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cm-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp",
    # Read-only startup publisher (Authenticode signer), status sampling (PDH, memory, power, battery) and insights.
    "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip",
    "Win32_System_Performance", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_Devices_DeviceAndDriverInstallation",
    # Read-only "is this disk image attached" query for installer cleanup (INC-04).
    "Win32_Storage_Vhd",
    # Which processes hold a file open (manual trash in-use reports, MTR-04): Restart Manager queries only.
    "Win32_System_RestartManager",
    # Optional AI diagnosis: provider keys in Credential Manager and the CredUI key prompt (AID-12).
    "Win32_Security_Credentials", "Win32_Graphics_Gdi", "Win32_System_Com",
    # App uninstall (UNI-02): close requests to an app's top-level windows (WM_CLOSE) before its uninstaller runs.
    "Win32_UI_WindowsAndMessaging",
    # System maintenance (parity 13.1/14.x): the short-lived UAC worker and its user-only named pipe, DNS/DISM entry points
    # resolved from System32, graceful shell-host restart, read-only diagnosis (process memory, session filter).
    "Win32_System_Pipes", "Win32_Security_Authorization", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop",
    "Win32_System_ProcessStatus",
    # Resident utilities (RES-04): read-only device property query for Bluetooth battery levels.
    "Win32_Devices_Properties",
    # Status network totals (STS-07): interface type/flags and octet counters from the IP Helper interface table.
    "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }
# Shell IFileOperation (recycle-bin moves) for the executor's trash action; read-only IShellLink, Task Scheduler and
# WMI queries for the startup inventory and disk insights.
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem",
    "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Wmi", "Win32_System_Com_StructuredStorage",
    # MSIX/Store app uninstall (UNI-01): PackageManager.RemovePackageAsync for the current user, no PowerShell.
    "Management_Deployment"] }
windows-core = "=0.62.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.177"
# CFString/CFDictionary/CFURL and plist values for app bundles, Service Management and power assertions.
core-foundation = "0.10.1"
# Code-signature checks (SecStaticCode: Team ID / signer of bundles, startup targets and update packages).
security-framework = "3.7.0"

[lints]
workspace = true

[dev-dependencies]
cm-fixtures = { path = "../cm-fixtures" }

# Test-only provider for the cloud placeholder boundary tests (Cloud Files API).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_CloudFilters", "Win32_System_CorrelationVector",
    # Real-device clean-screen test: injects a long Esc press.
    "Win32_UI_Input_KeyboardAndMouse"] }
